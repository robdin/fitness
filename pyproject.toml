[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitness-content-os"
version = "0.1.0"
description = "Research, production, experiment, and release controls for Project Fitness"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13"]

[project.scripts]
fitness-os = "fitness_os.cli:main"

[tool.setuptools.packages.find]
include = ["fitness_os*"]
